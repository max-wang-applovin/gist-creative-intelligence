name: Apply asynchronous dashboard refresh

on:
  push:
    branches: [main]
    paths:
      - .github/async-refresh.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/async-refresh.patch.gz.b64 | gzip --decompress > /tmp/async-refresh.patch
          git apply --check /tmp/async-refresh.patch
          git apply /tmp/async-refresh.patch
          rm .github/async-refresh.patch.gz.b64 .github/workflows/apply-async-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh cached dashboard data asynchronously"
          git push origin HEAD:main
