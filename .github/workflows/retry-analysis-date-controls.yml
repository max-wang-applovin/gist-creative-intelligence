name: Retry Ad Analysis date controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-analysis-date-controls.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/analysis-date-controls.patch.gz.b64')
          value = path.read_text().strip()
          assert len(value) == 2859
          path.write_text(value + '=')
          PY
          base64 --decode .github/analysis-date-controls.patch.gz.b64 | gzip --decompress > /tmp/analysis-date-controls.patch
          git apply --check /tmp/analysis-date-controls.patch
          git apply /tmp/analysis-date-controls.patch
          rm .github/analysis-date-controls.patch.gz.b64
          rm .github/workflows/apply-analysis-date-controls.yml
          rm .github/workflows/retry-analysis-date-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Ad Analysis date controls"
          git push origin HEAD:main
