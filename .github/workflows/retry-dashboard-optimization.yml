name: Retry dashboard optimization patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-dashboard-optimization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/dashboard-optimization.patch.gz.b64')
          value = path.read_text().strip()
          assert len(value) == 17138 and value[4614] == 'q' and value.endswith('==')
          path.write_text(value[:4614] + 'p' + value[4615:-2])
          PY
          base64 --decode .github/dashboard-optimization.patch.gz.b64 | gzip --decompress > /tmp/dashboard-optimization.patch
          git apply --check /tmp/dashboard-optimization.patch
          git apply /tmp/dashboard-optimization.patch
          rm .github/dashboard-optimization.patch.gz.b64
          rm .github/workflows/apply-dashboard-optimization.yml
          rm .github/workflows/retry-dashboard-optimization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize dashboard refreshes and rendering"
          git push origin HEAD:main
