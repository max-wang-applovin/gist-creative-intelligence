name: Retry final dashboard speed pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-final-speed-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/final-speed-pass.patch.gz.b64')
          value = path.read_text().strip()
          assert len(value) == 5079
          path.write_text(value + '=')
          PY
          base64 --decode .github/final-speed-pass.patch.gz.b64 | gzip --decompress > /tmp/final-speed-pass.patch
          git apply --check /tmp/final-speed-pass.patch
          git apply /tmp/final-speed-pass.patch
          rm .github/final-speed-pass.patch.gz.b64
          rm .github/workflows/apply-final-speed-pass.yml
          rm .github/workflows/retry-final-speed-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize Analysis media and static assets"
          git push origin HEAD:main
